services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantlab
      POSTGRES_USER: quantlab
      POSTGRES_PASSWORD: quantlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab -d quantlab"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://quantlab:quantlab@db:5432/quantlab
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - quantdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://quantlab:quantlab@db:5432/quantlab
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - quantdata:/data

  scheduler:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://quantlab:quantlab@db:5432/quantlab
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - quantdata:/data

  trade_stream:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.trade_stream"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://quantlab:quantlab@db:5432/quantlab
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  quantdata:
