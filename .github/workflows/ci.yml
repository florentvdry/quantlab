name: QuantLab CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        working-directory: backend
        env:
          PYTHONPATH: .
          QUANTLAB_DATA_DIR: /tmp/quantlab
        run: python -m compileall -q app tests
      - name: Quant regression tests
        working-directory: backend
        env:
          DATA_MODE: synthetic
          PYTHONPATH: .
          QUANTLAB_DATA_DIR: /tmp/quantlab
        run: python -m pytest -q

      - name: Build backend Docker image
        run: docker build -t quantlab-backend-ci ./backend
      - name: Smoke-test LightGBM inside backend image
        run: docker run --rm -e DATA_MODE=synthetic quantlab-backend-ci python -c "import lightgbm; import app.main; print('docker-lightgbm-smoke-ok')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
      - name: Build frontend Docker image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 -t quantlab-frontend-ci ./frontend